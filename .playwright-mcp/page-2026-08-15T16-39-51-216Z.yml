          - article [ref=f8e144]:
            - generic [ref=f8e145]:
              - paragraph [ref=f8e146]:
                - strong [ref=f8e147]: By Simone Harris
                - text: Licensed Bail Bond Agent
              - paragraph [ref=f8e148]:
                - text: When a loved one is arrested in Delaware, family members often hear the words
                - strong [ref=f8e149]: bail
                - text: and
                - strong [ref=f8e150]: bond
                - text: used as if they mean the same thing. The two terms are related, but they are not interchangeable — and confusing them can lead a family to arrange the wrong payment, wait longer for a release, or expect money back that was never refundable.
              - paragraph [ref=f8e152]:
                - strong [ref=f8e153]: "Quick answer:"
                - text: Bail is the amount of money or security the court sets to allow a defendant to be released before trial. A bond is the financial guarantee that satisfies that requirement. Cash bail is paid in full to the court. A surety bond is posted by a licensed bail bond company in exchange for a non-refundable premium — in Delaware, a filed rate generally between 5% and 10% of the bail amount for bonds over $1,000.
              - paragraph [ref=f8e154]: The right choice depends on the bail amount, the court's order, and your family's financial situation. This guide explains both options clearly so you can decide what to do next with confidence.
            - generic [ref=f8e155]:
              - heading "What Is Bail?" [level=2] [ref=f8e156]
              - paragraph [ref=f8e157]: Bail is the amount of money or security set by the court that allows a defendant to be released from custody while their case is pending. It is not a fine or a punishment. It is a financial arrangement designed to give the defendant an incentive to return for every required court appearance.
              - paragraph [ref=f8e158]: In Delaware, judges consider several factors when setting bail, including the seriousness of the charge, the defendant's criminal history, their ties to the community, and the risk that they might not return to court. The amount is set during the bail hearing or arraignment, and it can be reviewed or changed by the court later in the case.
              - paragraph [ref=f8e159]:
                - text: The bail amount itself is only one piece of the puzzle. Just as important is the
                - strong [ref=f8e160]: type of bail
                - text: the court orders — cash bail, surety bond, unsecured bond, or own recognizance. Each type has different requirements and a different effect on your family's finances. If you are trying to figure out how much was set, read our guide on
                - link "how to find out how much someone's bail is" [ref=f8e161] [cursor=pointer]:
                  - /url: /blog/how-do-you-find-out-how-much-someones-bail-is
                - text: .
            - generic [ref=f8e162]:
              - heading "What Is a Bond?" [level=2] [ref=f8e163]
              - paragraph [ref=f8e164]: A bond is a written, legally binding promise that the full bail amount will be paid if the defendant fails to appear in court. When a family uses a bail bond company, the company agrees to post the full bail amount with the court on the defendant's behalf. In exchange, the family pays the company a premium — a non-refundable service fee based on the bail amount.
              - paragraph [ref=f8e165]: "There are several types of bonds in Delaware, and the one the court allows depends on the order:"
              - list [ref=f8e166]:
                - listitem [ref=f8e167]:
                  - strong [ref=f8e168]: "Cash bond:"
                  - text: The full bail amount is paid to the court in cash.
                - listitem [ref=f8e169]:
                  - strong [ref=f8e170]: "Surety bond:"
                  - text: A licensed bail bond company posts the bail for a premium.
                - listitem [ref=f8e171]:
                  - strong [ref=f8e172]: "Unsecured bond:"
                  - text: A signed promise to appear, without paying money up front.
                - listitem [ref=f8e173]:
                  - strong [ref=f8e174]: "Own recognizance (O.R.):"
                  - text: Release on a personal promise to return to court.
              - paragraph [ref=f8e175]:
                - text: If the order permits a surety bond, a licensed Delaware bail agent can help. The agent reviews the case, the amount, and any co-signer or collateral requirements before posting the bond. Learn more about how this works in our guide to
                - link "bonding someone out of jail in Delaware" [ref=f8e176] [cursor=pointer]:
                  - /url: /blog/how-to-bond-someone-out-of-jail-delaware
                - text: .
            - generic [ref=f8e177]:
              - 'heading "Bail vs Bond: The 5 Key Differences" [level=2] [ref=f8e178]'
              - paragraph [ref=f8e179]: Here is the clearest way to separate the two terms — and the two very different ways to get someone out of custody.
              - table [ref=f8e181]:
                - rowgroup [ref=f8e182]:
                  - row [ref=f8e183]:
                    - columnheader "Question" [ref=f8e184]
