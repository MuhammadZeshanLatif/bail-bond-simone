              - paragraph [ref=f8e208]:
                - text: "Put simply:"
                - strong [ref=f8e209]: bail is the amount
                - text: ", and"
                - strong [ref=f8e210]: a bond is how that amount gets covered
                - text: . If the court allows a surety bond, a company covers the full amount for a premium so your family does not have to pay the entire bail figure out of pocket.
            - generic [ref=f8e211]:
              - heading "Cash Bail vs Surety Bond" [level=2] [ref=f8e212]
              - paragraph [ref=f8e213]: These are the two options families most often compare. Each has a different cost structure and a different refund outcome.
              - heading "Cash Bail" [level=3] [ref=f8e214]
              - paragraph [ref=f8e215]: With cash bail, the full amount set by the court is paid directly to the court. The money is held until the case ends. If the defendant attends every required hearing, the cash is refunded — usually minus any court fees or fines ordered as part of the case.
              - paragraph [ref=f8e216]: The trade-off is that your family must come up with the entire amount up front. For a $10,000 bail, that means $10,000 in cash today, tied up until the case concludes.
              - heading "Surety Bond" [level=3] [ref=f8e217]
              - paragraph [ref=f8e218]: With a surety bond, a licensed bail bond company posts the full bail amount with the court. The family pays the company a premium instead of the full bail figure. Under Delaware law, for surety bonds over $1,000, the filed premium must be between 5% and 10% of the bail amount, and at least 5% must be collected before the bond is posted.
              - paragraph [ref=f8e219]: For the same $10,000 bail, a surety bond would generally cost a premium of $500 to $1,000 — a far smaller upfront commitment than the full $10,000. The trade-off is that the premium is not refundable, and whoever signs as co-signer may be responsible for the full amount if the defendant fails to appear.
            - generic [ref=f8e220]:
              - heading "How Much Does a Bail Bond Cost in Delaware?" [level=2] [ref=f8e221]
              - paragraph [ref=f8e222]: Delaware law is specific about what a bail bond company may charge. For a surety bail bond, the premium must match the rate filed with and approved by the state. For surety bonds over $1,000, that filed premium is generally between 5% and 10% of the bail amount, and at least 5% must be collected before the bond is posted.
              - paragraph [ref=f8e223]: Delaware law does not allow unapproved administrative, service, company, or agent fees on top of the filed premium. Always ask the agent to explain every charge in writing, and confirm the premium and any collateral requirement before you sign. A licensed agent must provide a written contract.
              - paragraph [ref=f8e224]:
                - text: Need the full picture on costs, payment plans, and collateral? Read our complete
                - link "Delaware bail bond cost guide" [ref=f8e225] [cursor=pointer]:
                  - /url: /blog/how-much-does-a-bail-bond-cost-in-delaware
                - text: .
            - generic [ref=f8e226]:
              - heading "What Happens If the Defendant Misses Court?" [level=2] [ref=f8e227]
              - paragraph [ref=f8e228]: Missing a court date is serious under any bail arrangement. The court can issue a bench warrant for the defendant's arrest, and the bail — whether cash paid to the court or a surety bond — can be forfeited.
              - paragraph [ref=f8e229]: With cash bail, a missed appearance can mean the court keeps the full amount. With a surety bond, the company can be required to pay the court the full bail amount, and it can then turn to the co-signer to recover that money. Collateral posted for the bond may also be kept.
              - paragraph [ref=f8e230]: That is why the co-signer's role matters so much. Before anyone signs, they should understand that they are guaranteeing the defendant's appearance — not just paying a fee. Keep every court date in a calendar and contact the court or agent immediately if there is a genuine scheduling problem.
            - generic [ref=f8e231]:
              - heading "Can You Get Your Money Back?" [level=2] [ref=f8e232]
              - paragraph [ref=f8e233]: The refund rules are different for each option, and knowing them before you pay can prevent a painful surprise later.
              - list [ref=f8e234]:
                - listitem [ref=f8e235]:
                  - strong [ref=f8e236]: "Cash bail:"
                  - text: Refundable at the end of the case, provided the defendant attends every required hearing. Court costs or fines may be deducted.
                - listitem [ref=f8e237]:
                  - strong [ref=f8e238]: "Surety bond premium:"
                  - text: Not refundable. It is a service fee paid to the bond company, even if the case is dismissed.
                - listitem [ref=f8e239]:
                  - strong [ref=f8e240]: "Collateral:"
                  - text: Returned when the bond is exonerated and the case is closed, as long as all conditions are met.
              - paragraph [ref=f8e241]:
                - text: Ask for the refund and collateral terms
                - strong [ref=f8e242]: in writing
                - text: before signing any agreement. Verbal promises are not a substitute for the terms on the contract. If the court ordered an unsecured bond instead, read our guide to
                - link "unsecured bail in Delaware" [ref=f8e243] [cursor=pointer]:
                  - /url: /blog/what-is-unsecured-bail-delaware
                - text: to see how that type works.
            - generic [ref=f8e244]:
              - heading "Which Option Should You Choose?" [level=2] [ref=f8e245]
              - paragraph [ref=f8e246]: There is no single right answer — the best choice depends on the amount, the court's order, and what your family can manage.
              - list [ref=f8e247]:
                - listitem [ref=f8e248]:
                  - strong [ref=f8e249]: Choose cash bail if
                  - text: your family can pay the full amount up front and wants the money back when the case ends.
                - listitem [ref=f8e250]:
                  - strong [ref=f8e251]: Choose a surety bond if
                  - text: the court allows it and you want to avoid tying up the full amount for months.
                - listitem [ref=f8e252]:
                  - strong [ref=f8e253]: Ask about payment plans
                  - text: if the premium is still more than the family can pay at once.
              - paragraph [ref=f8e254]: A licensed Delaware bail agent can review the order, explain the options that apply to the case, and help you weigh the trade-offs before any money changes hands.
