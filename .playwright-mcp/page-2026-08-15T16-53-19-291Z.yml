                - text: Licensed Bail Bond Agent
              - paragraph [ref=f16e144]: An arrest for driving under the influence (DUI) is stressful and confusing, especially when you are trying to figure out how much money it will take to get your loved one home. The bail amount is only part of the story. What you actually pay out of pocket depends on the bail type the court allows, whether a licensed agent can post a bond, and the filed premium rate.
              - paragraph [ref=f16e146]:
                - strong [ref=f16e147]: "Quick answer:"
                - text: For a first DUI offense in Delaware, bail is commonly set between
                - strong [ref=f16e148]: $500 and $5,000
                - text: . If you use a licensed bail bond company, you pay a premium — in Delaware, a filed rate generally between
                - strong [ref=f16e149]: 5% and 10%
                - text: of the bail amount for bonds over $1,000 — instead of the full amount. For example, on a $2,000 bail, the premium would typically be
                - strong [ref=f16e150]: $100 to $200
                - text: .
              - paragraph [ref=f16e151]: This guide explains how DUI bail is set in Delaware, what amounts are typical, what you will actually pay, and the urgent deadlines you cannot afford to miss.
            - generic [ref=f16e152]:
              - heading "How Is DUI Bail Set in Delaware?" [level=2] [ref=f16e153]
              - paragraph [ref=f16e154]:
                - text: After a DUI arrest in New Castle County, the defendant is usually brought before a magistrate at
                - strong [ref=f16e155]: Justice of the Peace (JP) Court 11
                - text: in Newark, or through the statewide virtual criminal hearing system. JP Court 11 operates 24 hours a day, so initial appearances, arraignments, and bail-setting hearings happen around the clock — even on weekends and holidays.
              - paragraph [ref=f16e156]: "When the judicial officer sets bail, Delaware law directs them to weigh several factors:"
              - list [ref=f16e157]:
                - listitem [ref=f16e158]: The risk that the defendant will not appear in court
                - listitem [ref=f16e159]: The type of charge and how serious it is
                - listitem [ref=f16e160]: The defendant's criminal history, including any prior DUI or DUS convictions
                - listitem [ref=f16e161]: How long the defendant has lived in Delaware and their ties to the community
                - listitem [ref=f16e162]: The safety of the community
                - listitem [ref=f16e163]: Whether the arrest involved an accident, injury, or a child passenger
              - paragraph [ref=f16e164]: A first-time DUI with no accident, a moderate blood alcohol content (BAC), and strong community ties is much more likely to result in a moderate bail amount — or even release on personal recognizance. A repeat offense, a very high BAC, or a crash involving injury can push bail much higher.
            - generic [ref=f16e165]:
              - heading "Typical DUI Bail Amounts in Delaware" [level=2] [ref=f16e166]
              - paragraph [ref=f16e167]: DUI bail is set on a case-by-case basis, so there is no fixed price list. Still, most first-offense DUI cases fall within a fairly predictable range.
              - table [ref=f16e169]:
                - rowgroup [ref=f16e170]:
                  - row [ref=f16e171]:
                    - columnheader "Situation" [ref=f16e172]
                    - columnheader "Typical bail range" [ref=f16e173]
                - rowgroup [ref=f16e174]:
                  - row [ref=f16e175]:
                    - cell "First offense, no accident, moderate BAC" [ref=f16e176]
                    - cell "$500 – $2,500" [ref=f16e177]
                  - row [ref=f16e178]:
                    - cell "First offense with aggravating factors (high BAC, child in car)" [ref=f16e179]
                    - cell "$2,500 – $5,000+" [ref=f16e180]
                  - row [ref=f16e181]:
                    - cell "Second or third offense" [ref=f16e182]
                    - cell "$2,000 – $7,500+" [ref=f16e183]
                  - row [ref=f16e184]:
                    - cell "DUI with serious injury or felony-level charges" [ref=f16e185]
                    - cell "$10,000 – $50,000+" [ref=f16e186]
              - paragraph [ref=f16e187]:
                - text: "Three things matter more than the average: the"
                - strong [ref=f16e188]: exact bail amount on the written order
                - text: ", the"
                - strong [ref=f16e189]: bail type the court allows
                - text: ", and"
                - strong [ref=f16e190]: who is permitted to post it
                - text: . Do not rely on what someone heard by phone. If you are trying to confirm the amount, read our guide on
