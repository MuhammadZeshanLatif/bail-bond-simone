            - generic [ref=f16e192]:
              - 'heading "What You Actually Pay: Bail vs Bond Premium" [level=2] [ref=f16e193]'
              - paragraph [ref=f16e194]: The bail amount and the out-of-pocket cost are not the same thing. Understanding the difference can save your family thousands of dollars in confusion.
              - list [ref=f16e195]:
                - listitem [ref=f16e196]:
                  - strong [ref=f16e197]: "Cash bail:"
                  - text: The full amount is paid to the court and refunded at the end of the case if every appearance is met. On a $3,000 bail, you need $3,000 in cash up front.
                - listitem [ref=f16e198]:
                  - strong [ref=f16e199]: "Surety bond:"
                  - text: A licensed bail bond company posts the full bail for a non-refundable premium. In Delaware, that premium is a filed rate generally between
                  - strong [ref=f16e200]: 5% and 10%
                  - text: of the bail amount for bonds over $1,000. On a $3,000 bail, the premium would typically be
                  - strong [ref=f16e201]: $150 to $300
                  - text: — not $3,000.
              - paragraph [ref=f16e202]: The premium is a service fee and is not refunded, even if the case is dismissed. Any collateral you post is returned when the bond is exonerated and the case closes.
            - generic [ref=f16e203]:
              - 'heading "Delaware DUI Bail Bond Cost: The Rules" [level=2] [ref=f16e204]'
              - paragraph [ref=f16e205]:
                - text: Delaware law is specific about what a bail bond company may charge. For a surety bail bond, the premium must match the rate filed with and approved by the state. For surety bonds over $1,000, Delaware law sets the total filed premium between
                - strong [ref=f16e206]: 5% and 10%
                - text: ", and at least"
                - strong [ref=f16e207]: 5%
                - text: must be collected before the bond is posted.
              - paragraph [ref=f16e208]: Delaware law does not allow unapproved administrative, service, company, or agent fees on top of the filed premium. If an agent quotes a price that seems inconsistent with the filed rate, ask for it in writing and confirm the terms before signing. A licensed agent must provide a written contract.
              - paragraph [ref=f16e209]:
                - text: For the complete breakdown of premiums, payment plans, collateral, and refunds, read our
                - link "Delaware bail bond cost guide" [ref=f16e210] [cursor=pointer]:
                  - /url: /blog/how-much-does-a-bail-bond-cost-in-delaware
                - text: .
            - generic [ref=f16e211]:
              - heading "What If You Can't Afford the Premium?" [level=2] [ref=f16e212]
              - paragraph [ref=f16e213]: If the full premium is more than your family can pay in one payment, ask about payment arrangements. Payment plans may be available depending on the bond, the applicant, and the written agreement. A payment plan is not the same as a discount on the filed premium — the rate is still set by law — but it can spread the cost over a manageable schedule.
              - paragraph [ref=f16e214]: "If the bail itself feels unreasonably high, a DUI defense attorney can ask the court to review the amount. That is separate from the bail bond process: an attorney advises on the legal case, while a licensed bail agent handles the release process. Many families work with both."
            - generic [ref=f16e215]:
              - 'heading "Urgent: The 15-Day DMV License Deadline" [level=2] [ref=f16e216]'
              - paragraph [ref=f16e217]: "A DUI arrest in Delaware triggers two separate processes at the same time: the criminal court case and an administrative hearing with the Delaware Division of Motor Vehicles (DMV)."
              - blockquote [ref=f16e218]:
                - text: "\""
                - strong [ref=f16e219]: You have only 15 days from the date of the arrest
                - text: to request an administrative hearing with the DMV. If you miss this deadline, the driver's license is automatically suspended.
              - paragraph [ref=f16e220]:
                - text: Getting out of jail quickly matters here — a released defendant can meet that deadline, consult with an attorney, and protect their driving privileges. For the full walkthrough of a DUI arrest in the Wilmington area, see our guide to
                - link "traffic arrest bail bonds in Wilmington" [ref=f16e221] [cursor=pointer]:
                  - /url: /blog/traffic-bail-bonds-wilmington-delaware
                - text: .
            - generic [ref=f16e222]:
              - heading "What Happens After Release" [level=2] [ref=f16e223]
              - paragraph [ref=f16e224]: "Posting bail gets the defendant out of custody — it does not end the case. After release, the defendant must follow every condition in the bond order and attend all future hearings. In DUI cases, conditions can include:"
              - list [ref=f16e225]:
                - listitem [ref=f16e226]: Attending every scheduled court date
                - listitem [ref=f16e227]: No driving without a valid license
                - listitem [ref=f16e228]: Installing an ignition interlock device
                - listitem [ref=f16e229]: Abstaining from alcohol or drugs
                - listitem [ref=f16e230]: Completing alcohol education or treatment programs
              - paragraph [ref=f16e231]:
                - text: Missing court can lead to a bench warrant and financial responsibility for whoever signed the bond. Put every hearing date on a calendar, save the paperwork, and contact the court or agent immediately if there is a genuine scheduling problem. For step-by-step guidance, read our article on
                - link "how to bond someone out of jail in Delaware" [ref=f16e232] [cursor=pointer]:
                  - /url: /blog/how-to-bond-someone-out-of-jail-delaware
                - text: .
